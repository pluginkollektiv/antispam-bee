name: Plugin Check
on:
  pull_request:
  push:
    branches:
      - v3
  release:
    types: [ published ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: latest
          coverage: none
          tools: wp-cli

      - name: Install dist-archive command
        # `wp package install` forwards GITHUB_TOKEN to Composer's github-oauth
        # config, and Composer rejects both the runner's token format and an
        # empty value. wp-cli only skips it when the variable is absent (it
        # guards with is_string(), and getenv() returns '' for a set-but-empty
        # var), so unset it entirely — the package is public and needs no auth.
        run: |
          unset GITHUB_TOKEN
          wp package install wp-cli/dist-archive-command:^3.1

      - name: Build plugin
        run: |
          wp dist-archive . ./${{ github.event.repository.name }}.zip
          mkdir tmp-build
          unzip ${{ github.event.repository.name }}.zip -d tmp-build

      - name: Run plugin check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./tmp-build/${{ github.event.repository.name }}
