name: Plugin Check
on:
  pull_request:
  push:
    branches:
      - v3
  release:
    types: [ published ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: latest
          coverage: none
          tools: wp-cli

      - name: Install dist-archive command
        # Clear GITHUB_TOKEN so `wp package install` does not pass the runner's
        # Actions token to Composer's github-oauth config (Composer rejects its
        # format). The package is public, so no authentication is required.
        env:
          GITHUB_TOKEN: ''
        run: wp package install wp-cli/dist-archive-command:^3.1

      - name: Build plugin
        run: |
          wp dist-archive . ./${{ github.event.repository.name }}.zip
          mkdir tmp-build
          unzip ${{ github.event.repository.name }}.zip -d tmp-build

      - name: Run plugin check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./tmp-build/${{ github.event.repository.name }}
