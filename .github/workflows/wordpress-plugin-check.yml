name: Plugin Check
on:
  pull_request:
  push:
    branches:
      - v3
  release:
    types: [ published ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: latest
          coverage: none
          tools: wp-cli

      - name: Install dist-archive command
        # setup-php seeds Composer's auth with a github-oauth token that Composer
        # rejects as malformed, and `wp package install` registers the package as
        # a GitHub VCS repo, which forces that token to be used. Isolate Composer
        # from the ambient auth: a fresh COMPOSER_HOME (no seeded auth.json), an
        # empty COMPOSER_AUTH, and no GITHUB_TOKEN. The package is public, so
        # anonymous access is sufficient.
        env:
          COMPOSER_HOME: ${{ runner.temp }}/composer-home
          COMPOSER_AUTH: '{}'
        run: |
          unset GITHUB_TOKEN
          wp package install wp-cli/dist-archive-command:^3.1

      - name: Build plugin
        run: |
          wp dist-archive . ./${{ github.event.repository.name }}.zip
          mkdir tmp-build
          unzip ${{ github.event.repository.name }}.zip -d tmp-build

      - name: Run plugin check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./tmp-build/${{ github.event.repository.name }}
